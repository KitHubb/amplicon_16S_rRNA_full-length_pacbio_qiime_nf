name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.04.2'
      - name: Script regression checks
        run: bash tests/test_python_and_shell.sh
      - name: Resolve runtime profiles
        run: |
          for profile in docker singularity apptainer test,docker test_full,docker test_stub; do
            nextflow config -profile "$profile" -flat > /dev/null
          done
      - name: Full graph including taxonomy (stub artifacts only)
        run: |
          nextflow run . -profile test_stub -stub-run --taxonomy_enabled true --taxonomy_classifier tests/data/classifier.stub --outdir results/stub -ansi-log false
          python3 tests/check_outputs.py results/stub --stub
      - name: Real QC with automatic BioContainers downloads
        run: |
          nextflow run . -profile test,docker --outdir results/test -ansi-log false
          python3 tests/check_outputs.py results/test
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          include-hidden-files: true
          path: |
            .nextflow.log*
            results/
            work/**/.command.*

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tests/release_notes.py "$RELEASE_TAG" > release-notes.md
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
